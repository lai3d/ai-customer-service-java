# Tempo, single binary, local storage: OTLP in on 4317/4318, TraceQL out on 3200, and the
# metrics-generator turning spans into RED metrics and a service graph that it pushes to
# Prometheus over remote write. That last part is why Tempo rather than Jaeger: with the roles
# split, the edges chat -> knowledge and chat -> ticket appear in Grafana's service map
# without a line of instrumentation for them.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
