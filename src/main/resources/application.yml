server:
  servlet:
    session:
      cookie:
        # The session cookie is the staff login. HttpOnly is the default; SameSite=Lax keeps
        # it off cross-site POSTs, with CSRF tokens as the second layer. `secure` is left to
        # the request: set behind TLS, not set on a laptop over plain HTTP.
        http-only: true
        same-site: lax
  # Rolling deploys otherwise cut in-flight requests mid-answer, and an SSE stream is in flight
  # for as long as the model is still talking. Graceful shutdown stops accepting new requests
  # and lets the current ones finish.
  shutdown: graceful

spring:
  application:
    name: ai-customer-service-java

  lifecycle:
    # Long enough for a streamed answer to finish, short enough that a deploy is not held up by
    # one stuck connection. Must stay below the pod's terminationGracePeriodSeconds, or
    # Kubernetes SIGKILLs the container in the middle of the grace period it was given.
    timeout-per-shutdown-phase: ${SHUTDOWN_GRACE:30s}

  # Loom. Every LLM call is a long, blocking I/O wait; virtual threads carry them
  # without dragging the whole codebase into a reactive programming model.
  threads:
    virtual:
      enabled: true

  # Applies to the RestClient the Anthropic/OpenAI/Gemini clients are built on. Spring Boot
  # ships no default here, so without it a hung upstream request never returns and the request
  # thread waits forever. Read timeout is generous because a long answer legitimately takes
  # time; it guards against a stall, not against slowness.
  http:
    client:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:10s}
      read-timeout: ${HTTP_READ_TIMEOUT:120s}

  # Staff sessions for the operations admin, in Postgres. The chat role runs as replicas
  # behind one Service; a session held in one JVM would sign a person out whenever the
  # Service picked the other replica. Flyway owns the tables (V4), so the initialiser is off
  # for the same reason Spring AI's are. Only /admin/** ever opens a session.
  session:
    jdbc:
      initialize-schema: never
    # Idle time before a staff session ends. Sessions carry access to customer conversations,
    # so the default is short; raise it deliberately.
    timeout: ${ADMIN_SESSION_TIMEOUT:30m}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:csagent}
    username: ${POSTGRES_USER:csagent}
    password: ${POSTGRES_PASSWORD:csagent}
    hikari:
      maximum-pool-size: 20

  # The schema is versioned in db/migration and owned here. Spring AI's own initialisers are
  # off (below); V1 recreates their tables IF NOT EXISTS, and baseline-on-migrate lets it run
  # against a database those initialisers already populated, keeping every row. Flyway takes a
  # Postgres advisory lock for the whole migration, so two replicas starting against an empty
  # database take turns rather than racing on CREATE EXTENSION.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  ai:
    model:
      # Mandatory now that more than one chat starter is on the classpath. Each provider's
      # auto-configuration matches when this is absent, so leaving it unset builds several
      # ChatModel beans and the context fails to start. It fails loudly at boot, which is the
      # good version of this problem.
      chat: ${CHAT_PROVIDER:anthropic}
      # Pinned for the same reason: google-genai also ships an embedding auto-configuration.
      embedding: transformers
      # A provider starter brings every model type that provider supports, not just chat --
      # the OpenAI one adds speech, transcription, image, and moderation auto-configurations,
      # each of which builds by default and throws for want of an API key. Switching them off
      # is not tidying: without it the application does not start.
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    # Spring AI's defaults are max-attempts 10 with a 2s initial interval, a multiplier of 5
    # and a 180s cap. That is 2+10+50+180*6 = 1142 seconds of backoff -- a customer watching a
    # spinner for nineteen minutes before being told it did not work. Sensible for a nightly
    # batch job, wrong for an interactive assistant.
    #
    # Three attempts with a 1s/2s gap caps the added wait at three seconds. If the provider is
    # still failing after that, saying so quickly is a better answer than trying harder.
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s

    anthropic:
      # The binder ignores an unresolvable placeholder rather than raising, so this alone
      # does NOT fail startup -- it binds to the literal "${ANTHROPIC_API_KEY}" and the
      # application reports itself healthy while every request 401s.
      # AnthropicApiKeyValidator is what actually refuses to start.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Spring AI 1.1.8's AnthropicApi.ChatModel enum stops at Claude Opus 4.6,
          # so current model IDs are given as plain strings.
          model: claude-opus-5
          max-tokens: 8192
          # Sampling parameters (temperature / top_p / top_k) are deliberately absent:
          # Claude Opus 5 rejects them with HTTP 400. They cannot be switched off from
          # here -- see config/SeededSamplingParameterStripper for why, and
          # AnthropicChatOptionsTest for the guard.

    # --- Alternative providers -------------------------------------------------------
    # Selected with CHAT_PROVIDER. Nothing in src/main/java changes between them: the advisor
    # chain, the tools, streaming, and the metrics are all written against Spring AI's
    # ChatModel interface. Model ids below are the ones Spring AI 1.1.8 knows about; a newer
    # model just goes in the environment variable.
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Also the seam for any OpenAI-compatible API. xAI's Grok is reached by pointing this at
      # https://api.x.ai and setting OPENAI_CHAT_MODEL to a Grok model -- there is no xAI
      # starter in Spring AI, so it rides on the OpenAI client. That is a compatibility layer,
      # not first-class support: xAI-only features are not reachable through it.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5}
          # Off by default, and the consequence is silent: OpenAI omits usage from a streamed
          # response unless the request asks for it, so every streamed turn reported no tokens
          # at all. The conversation budget would never trigger and chat.cost.usd would stay at
          # zero while real money was spent. Found by running it, not by reading anything.
          stream-usage: true

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            # Picking a default here is genuinely awkward and the obvious heuristics are
            # wrong. gemini-3-pro-preview 404s on accounts without preview access.
            # gemini-2.5-pro is listed by the models API and still 404s -- "no longer
            # available to new users" -- so "prefer generally available over preview" fails
            # too. Google's own error directs new accounts to this one. Expect it to age;
            # list what a key can actually reach with:
            #   curl "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY"
            #
            # A flash model, not a pro one, because the free tier's quota for pro is literally
            # zero -- gemini-3.1-pro-preview returns 429 "limit: 0" on a free key. A default
            # that only works on a paid account is a default most readers cannot run.
            model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}

    # xAI, registered as its own provider by XaiChatConfig rather than by borrowing OpenAI's
    # slot. Spring AI ships no xAI starter and xAI speaks OpenAI's protocol, so the client is
    # reused while the credentials, base URL and model are its own. Select with
    # CHAT_PROVIDER=xai.
    xai:
      api-key: ${XAI_API_KEY:}
      base-url: ${XAI_BASE_URL:https://api.x.ai}
      completions-path: /v1/chat/completions
      # List what a key can actually reach:
      #   curl https://api.x.ai/v1/models -H "Authorization: Bearer $XAI_API_KEY"
      model: ${XAI_CHAT_MODEL:grok-4.6}

    embedding:
      transformer:
        # multilingual-e5-small, loaded in-process. Anthropic has no embedding API.
        #
        # This is the second multilingual model tried. paraphrase-multilingual-MiniLM-L12-v2
        # was measured first and rejected: it is trained for symmetric similarity (is sentence
        # A like sentence B), not retrieval (does this short query match this long passage),
        # and it showed exactly that failure -- a colloquial Chinese damage report scored 0.21
        # against its own answer while an unrelated question scored 0.14, leaving no threshold
        # that could keep one and reject the other. The e5 family is retrieval-trained.
        #
        # Still 384 dimensions, so the pgvector column did not have to change. The fp32 export
        # is used rather than a quantised one because the qint8 builds are per-architecture
        # and would make the image unportable; the Dockerfile exposes it as a build arg.
        onnx:
          model-uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/tokenizer.json
        cache:
          enabled: true
          directory: ${user.dir}/onnx-model-cache

    vectorstore:
      pgvector:
        # Flyway owns the table; see db/migration/V1. Leaving this on would race it.
        initialize-schema: false
        # Must match the embedding model's output width (multilingual-e5-small = 384).
        dimensions: 384
        index-type: hnsw
        # Readable primary keys: documents are keyed "faq:returns-window" rather than an
        # opaque UUID, so a row in vector_store can be traced to its corpus entry by eye.
        # Changing this after the table exists requires recreating it.
        id-type: text
        distance-type: cosine-distance
        table-name: vector_store

    chat:
      memory:
        repository:
          jdbc:
            # Flyway owns the table; see db/migration/V1.
            initialize-schema: never

app:
  # Only a single-role process reads these; `all` calls the roles in-process and serves no
  # internal endpoint. A chat process refuses to start without all three; a knowledge or
  # ticket process without the token. See docs/adr/001-deployment-targets.md.
  internal:
    # Shared secret on every /internal/** call, service to service. Not customer authentication.
    token: ${INTERNAL_TOKEN:}
  services:
    knowledge:
      url: ${KNOWLEDGE_URL:}
    ticket:
      url: ${TICKET_URL:}
    # For internal calls only. The model client's 120s read timeout is for a model that takes
    # that long; a tool call that waits that long holds the customer with it.
    timeout: ${SERVICES_TIMEOUT:5s}

  admin:
    # The seed command for the first staff admin: with both set, the process creates that
    # admin at startup if -- and only if -- staff_account is empty, then logs what it did.
    # Never overwrites or resets an account, so it is safe to leave set; one without the
    # other refuses to start. See docs/operations-admin.md.
    seed:
      username: ${ADMIN_SEED_USERNAME:}
      password: ${ADMIN_SEED_PASSWORD:}

  chat:
    # How long one turn may hold its conversation. A second request on a conversation with a
    # turn in flight is refused with 409 rather than interleaving two histories; the lease
    # expires so a crashed replica cannot hold a conversation forever. Must exceed
    # spring.http.client.read-timeout, or a slow but healthy turn loses its own conversation.
    turn-lease: ${TURN_LEASE:150s}

  # What this process is: all (the default, every role in one JVM), or one of chat, knowledge,
  # ticket. A single role switches off what it does not run (TargetEnvironmentPostProcessor)
  # and refuses to start without the app.internal / app.services settings it needs.
  # See docs/adr/001-deployment-targets.md.
  target: ${APP_TARGET:all}

  cost:
    # A single conversation is otherwise an open-ended bill: memory is windowed so any one
    # request is bounded, but the number of requests is not. Reaching the cap hands the
    # customer to a human, which is the right outcome for a conversation this long anyway.
    # 0 disables the cap.
    conversation-token-budget: ${CONVERSATION_TOKEN_BUDGET:200000}
    # Spend lives in Postgres (conversation_budget), shared by every replica and kept across
    # restarts. Rows untouched for this long are swept, because a table keyed by conversation
    # id grows without bound otherwise -- the same leak the old in-memory map was bounded
    # against. Longer than any conversation is likely to be resumed after.
    budget-retention: 30d
    # Dollars per million tokens. Keep in step with the provider's published pricing; nothing
    # here can detect that it has drifted. A model with no entry has its tokens counted but
    # not costed.
    #
    # Key on the id the provider *reports*, not the one you requested: asking for `gpt-5`
    # produces metrics tagged `gpt-5-2025-08-07`, and a price keyed on `gpt-5` would never
    # match. The failure is silent -- tokens keep counting, cost stays at zero.
    prices:
      claude-opus-5:
        input-per-million-usd: 5.00
        output-per-million-usd: 25.00
      claude-sonnet-5:
        input-per-million-usd: 2.00
        output-per-million-usd: 10.00

  observability:
    # Spring AI attaches the search query to the vector-store span unconditionally -- there is
    # no property for it, unlike log-prompt / log-completion / log-query-response, which all
    # default to off. For a support assistant the query is often the most sensitive thing in
    # the request, and traces get retained and read widely. Off unless you are debugging
    # retrieval and understand where those spans end up.
    include-query-content: ${TRACE_INCLUDE_QUERY_CONTENT:false}

  rag:
    corpus-location: classpath:/faq/faq.json
    # startup: import the bundled corpus when the application is ready, then serve (the
    #          default; what `all` and a laptop want).
    # once:    import, then exit -- for a Kubernetes Job or a run-once Compose service, so
    #          serving replicas of the knowledge role never re-embed on every restart.
    # off:     never import; serve whatever the database holds.
    # Whichever mode, the importer holds a database advisory lock and records the corpus
    # version it completed in corpus_import, so an already-imported version is skipped and
    # readiness can tell a fresh database from an imported one.
    import-mode: ${APP_RAG_IMPORT_MODE:startup}
    # Passages per question. Each one is re-sent on every turn it informs, so this trades
    # recall against tokens -- and the trade was measured rather than guessed, because the
    # relevant and irrelevant passages for a multi-intent question sit within about 0.03 of
    # each other and which ranks first is close to noise.
    #
    #   topK   recall (14 cases)   ~tokens of context per turn
    #      4          12/14                    223
    #      8          13/14                    452
    #     13          14/14                    717
    #
    # 8 buys one of the two failures for about 230 tokens, roughly 13% on top of a typical
    # 1700-token request. 13 buys the other for 29%, and means putting a third of a
    # thirty-six-document corpus into every prompt; that case is recorded as a known limit in
    # docs/retrieval.md instead. TopKTradeoffTest re-measures the table.
    top-k: 8
    # Zero, because every non-zero value measured here filters nothing real.
    #
    # With the previous English-only model the two populations were cleanly separated and a
    # threshold was a genuine relevance filter. e5 compresses cosine similarity into a narrow
    # high band, and the first measurement here -- 20 relevant against 5 off-topic questions --
    # put the weakest true match at 0.8378 and the strongest off-topic at 0.8318, a margin of
    # 0.006. That reading was optimistic because the sample was small. Widening it inverts the
    # result:
    #
    #   relevant     weakest    0.8378  "my parcel showed up broken"
    #   off-topic    strongest  0.8543  "你们公司多少人"      (n=15)
    #   degenerate   strongest  0.8417  "。。。"              (n=12)
    #
    # The populations overlap. A threshold high enough to reject "你们公司多少人" also rejects
    # real questions, and one low enough to keep them accepts three full stops. 0.5 was neither
    # -- it filtered nothing and implied a mechanism that did not exist. Relevance judgement
    # lives in the system prompt; this stays 0 so nothing pretends otherwise.
    # FaqRetrievalIntegrationTest pins the overlap.
    similarity-threshold: 0
    # e5 models are trained with these asymmetric markers; they are part of the model
    # contract, not decoration. Blank them out for a model that does not want them.
    query-prefix: "query: "
    passage-prefix: "passage: "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          # A process with no corpus imported can answer nothing grounded. On a fresh database
          # this is DOWN until the importer has finished; liveness is unaffected.
          include: readinessState,corpus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, not just count/sum/max, for the timers a dashboard needs a
      # percentile of. Without these Prometheus sees a summary, histogram_quantile has nothing
      # to work on, and there is no bucket for an exemplar to hang a trace id from.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        gen_ai.client.operation: true
        db.vector.client.operation: true
      # Turns take seconds and model calls take longer; the default buckets top out too early.
      maximum-expected-value:
        http.server.requests: 120s
        gen_ai.client.operation: 120s
        http.client.requests: 30s
        db.vector.client.operation: 5s

  # --- Distributed tracing ---
  #
  # Spring AI's observations already use OpenTelemetry's GenAI semantic conventions
  # (gen_ai.usage.input_tokens, gen_ai.request.model, ...), so this exports spans rather than
  # inventing a vocabulary. It matters more here than in an ordinary service: one chat turn is
  # retrieval, then a model call, then possibly a tool call and a second model call. Metrics
  # can say a turn took eight seconds; only a trace says which of those four spans it was.
  tracing:
    sampling:
      # Spring Boot's default is 0.1. At that rate nine out of ten conversations produce no
      # trace at all, which reads as "tracing is broken" rather than "tracing is sampled".
      # 1.0 for a demo; lower this deliberately under real traffic.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    # Metrics over OTLP, pushed, as an alternative to Prometheus pulling /actuator/prometheus.
    # Off by default: pull needs no collector and is what Kubernetes expects. On, the same
    # Micrometer meters go to the endpoint below every `step`; the names arrive with dots and
    # a Prometheus-compatible backend translates them (chat.tokens -> chat_tokens_total), which
    # the dashboard test checks against both paths.
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 15s
        # Micrometer's OTLP registry reports timers in milliseconds by default; Prometheus
        # renders that as http_server_requests_milliseconds_bucket and every dashboard query
        # written against the pull path stops matching. Seconds, same as the pull path.
        base-time-unit: seconds
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off unless a collector is actually running, otherwise `./mvnw spring-boot:run` on its
        # own fills the log with export failures. `docker compose up` turns it on, because that
        # brings Tempo up alongside the app.
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:false}

logging:
  level:
    org.springframework.ai: INFO
