spring:
  application:
    name: ai-customer-service-java

  # Loom. Every LLM call is a long, blocking I/O wait; virtual threads carry them
  # without dragging the whole codebase into a reactive programming model.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:csagent}
    username: ${POSTGRES_USER:csagent}
    password: ${POSTGRES_PASSWORD:csagent}
    hikari:
      maximum-pool-size: 20

  ai:
    anthropic:
      # The binder ignores an unresolvable placeholder rather than raising, so this alone
      # does NOT fail startup -- it binds to the literal "${ANTHROPIC_API_KEY}" and the
      # application reports itself healthy while every request 401s.
      # AnthropicApiKeyValidator is what actually refuses to start.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Spring AI 1.1.8's AnthropicApi.ChatModel enum stops at Claude Opus 4.6,
          # so current model IDs are given as plain strings.
          model: claude-opus-5
          max-tokens: 8192
          # Sampling parameters (temperature / top_p / top_k) are deliberately absent:
          # Claude Opus 5 rejects them with HTTP 400. They cannot be switched off from
          # here -- see config/AnthropicSamplingParameterStripper for why, and
          # AnthropicChatOptionsTest for the guard.

    embedding:
      transformer:
        # multilingual-e5-small, loaded in-process. Anthropic has no embedding API.
        #
        # This is the second multilingual model tried. paraphrase-multilingual-MiniLM-L12-v2
        # was measured first and rejected: it is trained for symmetric similarity (is sentence
        # A like sentence B), not retrieval (does this short query match this long passage),
        # and it showed exactly that failure -- a colloquial Chinese damage report scored 0.21
        # against its own answer while an unrelated question scored 0.14, leaving no threshold
        # that could keep one and reject the other. The e5 family is retrieval-trained.
        #
        # Still 384 dimensions, so the pgvector column did not have to change. The fp32 export
        # is used rather than a quantised one because the qint8 builds are per-architecture
        # and would make the image unportable; the Dockerfile exposes it as a build arg.
        onnx:
          model-uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/tokenizer.json
        cache:
          enabled: true
          directory: ${user.dir}/onnx-model-cache

    vectorstore:
      pgvector:
        initialize-schema: true
        # Must match the embedding model's output width (all-MiniLM-L6-v2 = 384).
        dimensions: 384
        index-type: hnsw
        # Readable primary keys: documents are keyed "faq:returns-window" rather than an
        # opaque UUID, so a row in vector_store can be traced to its corpus entry by eye.
        # Changing this after the table exists requires recreating it.
        id-type: text
        distance-type: cosine-distance
        table-name: vector_store

    chat:
      memory:
        repository:
          jdbc:
            # Defaults to `embedded`, which is a no-op against a real Postgres.
            initialize-schema: always

app:
  rag:
    corpus-location: classpath:/faq/faq.json
    ingest-on-startup: true
    # Passages per question. Each one is re-sent on every turn it informs, so this trades
    # recall against tokens.
    top-k: 4
    # A floor, NOT a relevance filter -- and that distinction is measured, not assumed.
    #
    # With the previous English-only model the two populations were cleanly separated:
    # correct answers scored 0.34 to 0.63, unrelated questions peaked at 0.11, so 0.3 sat in
    # open space. e5 compresses cosine similarity into a narrow high band. Across 30 queries
    # (20 relevant, 10 off-topic, both languages) the weakest true match scored 0.8378 and the
    # strongest off-topic scored 0.8318 -- a margin of 0.006, which is noise, not signal.
    # Tuning to 0.835 would fit those 30 queries and break on the 31st.
    #
    # So relevance filtering moved out of the retriever and into the prompt: the system prompt
    # requires grounding and instructs the model to say what it does not know. The retriever's
    # job is now ranking, which it does well -- 20 of 20 paraphrased questions retrieve the
    # right entry first. See FaqRetrievalIntegrationTest.
    similarity-threshold: 0.5
    # e5 models are trained with these asymmetric markers; they are part of the model
    # contract, not decoration. Blank them out for a model that does not want them.
    query-prefix: "query: "
    passage-prefix: "passage: "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.ai: INFO
