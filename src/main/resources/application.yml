spring:
  application:
    name: ai-customer-service-java

  # Loom. Every LLM call is a long, blocking I/O wait; virtual threads carry them
  # without dragging the whole codebase into a reactive programming model.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:csagent}
    username: ${POSTGRES_USER:csagent}
    password: ${POSTGRES_PASSWORD:csagent}
    hikari:
      maximum-pool-size: 20

  ai:
    model:
      # Mandatory now that more than one chat starter is on the classpath. Each provider's
      # auto-configuration matches when this is absent, so leaving it unset builds several
      # ChatModel beans and the context fails to start. It fails loudly at boot, which is the
      # good version of this problem.
      chat: ${CHAT_PROVIDER:anthropic}
      # Pinned for the same reason: google-genai also ships an embedding auto-configuration.
      embedding: transformers
      # A provider starter brings every model type that provider supports, not just chat --
      # the OpenAI one adds speech, transcription, image, and moderation auto-configurations,
      # each of which builds by default and throws for want of an API key. Switching them off
      # is not tidying: without it the application does not start.
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

    anthropic:
      # The binder ignores an unresolvable placeholder rather than raising, so this alone
      # does NOT fail startup -- it binds to the literal "${ANTHROPIC_API_KEY}" and the
      # application reports itself healthy while every request 401s.
      # AnthropicApiKeyValidator is what actually refuses to start.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Spring AI 1.1.8's AnthropicApi.ChatModel enum stops at Claude Opus 4.6,
          # so current model IDs are given as plain strings.
          model: claude-opus-5
          max-tokens: 8192
          # Sampling parameters (temperature / top_p / top_k) are deliberately absent:
          # Claude Opus 5 rejects them with HTTP 400. They cannot be switched off from
          # here -- see config/AnthropicSamplingParameterStripper for why, and
          # AnthropicChatOptionsTest for the guard.

    # --- Alternative providers -------------------------------------------------------
    # Selected with CHAT_PROVIDER. Nothing in src/main/java changes between them: the advisor
    # chain, the tools, streaming, and the metrics are all written against Spring AI's
    # ChatModel interface. Model ids below are the ones Spring AI 1.1.8 knows about; a newer
    # model just goes in the environment variable.
    openai:
      api-key: ${OPENAI_API_KEY:}
      # Also the seam for any OpenAI-compatible API. xAI's Grok is reached by pointing this at
      # https://api.x.ai and setting OPENAI_CHAT_MODEL to a Grok model -- there is no xAI
      # starter in Spring AI, so it rides on the OpenAI client. That is a compatibility layer,
      # not first-class support: xAI-only features are not reachable through it.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5}

    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3-pro-preview}

    embedding:
      transformer:
        # multilingual-e5-small, loaded in-process. Anthropic has no embedding API.
        #
        # This is the second multilingual model tried. paraphrase-multilingual-MiniLM-L12-v2
        # was measured first and rejected: it is trained for symmetric similarity (is sentence
        # A like sentence B), not retrieval (does this short query match this long passage),
        # and it showed exactly that failure -- a colloquial Chinese damage report scored 0.21
        # against its own answer while an unrelated question scored 0.14, leaving no threshold
        # that could keep one and reject the other. The e5 family is retrieval-trained.
        #
        # Still 384 dimensions, so the pgvector column did not have to change. The fp32 export
        # is used rather than a quantised one because the qint8 builds are per-architecture
        # and would make the image unportable; the Dockerfile exposes it as a build arg.
        onnx:
          model-uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/tokenizer.json
        cache:
          enabled: true
          directory: ${user.dir}/onnx-model-cache

    vectorstore:
      pgvector:
        initialize-schema: true
        # Must match the embedding model's output width (all-MiniLM-L6-v2 = 384).
        dimensions: 384
        index-type: hnsw
        # Readable primary keys: documents are keyed "faq:returns-window" rather than an
        # opaque UUID, so a row in vector_store can be traced to its corpus entry by eye.
        # Changing this after the table exists requires recreating it.
        id-type: text
        distance-type: cosine-distance
        table-name: vector_store

    chat:
      memory:
        repository:
          jdbc:
            # Defaults to `embedded`, which is a no-op against a real Postgres.
            initialize-schema: always

app:
  observability:
    # Spring AI attaches the search query to the vector-store span unconditionally -- there is
    # no property for it, unlike log-prompt / log-completion / log-query-response, which all
    # default to off. For a support assistant the query is often the most sensitive thing in
    # the request, and traces get retained and read widely. Off unless you are debugging
    # retrieval and understand where those spans end up.
    include-query-content: ${TRACE_INCLUDE_QUERY_CONTENT:false}

  rag:
    corpus-location: classpath:/faq/faq.json
    ingest-on-startup: true
    # Passages per question. Each one is re-sent on every turn it informs, so this trades
    # recall against tokens.
    top-k: 4
    # A floor, NOT a relevance filter -- and that distinction is measured, not assumed.
    #
    # With the previous English-only model the two populations were cleanly separated:
    # correct answers scored 0.34 to 0.63, unrelated questions peaked at 0.11, so 0.3 sat in
    # open space. e5 compresses cosine similarity into a narrow high band. Across 30 queries
    # (20 relevant, 10 off-topic, both languages) the weakest true match scored 0.8378 and the
    # strongest off-topic scored 0.8318 -- a margin of 0.006, which is noise, not signal.
    # Tuning to 0.835 would fit those 30 queries and break on the 31st.
    #
    # So relevance filtering moved out of the retriever and into the prompt: the system prompt
    # requires grounding and instructs the model to say what it does not know. The retriever's
    # job is now ranking, which it does well -- 20 of 20 paraphrased questions retrieve the
    # right entry first. See FaqRetrievalIntegrationTest.
    similarity-threshold: 0.5
    # e5 models are trained with these asymmetric markers; they are part of the model
    # contract, not decoration. Blank them out for a model that does not want them.
    query-prefix: "query: "
    passage-prefix: "passage: "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

  # --- Distributed tracing ---
  #
  # Spring AI's observations already use OpenTelemetry's GenAI semantic conventions
  # (gen_ai.usage.input_tokens, gen_ai.request.model, ...), so this exports spans rather than
  # inventing a vocabulary. It matters more here than in an ordinary service: one chat turn is
  # retrieval, then a model call, then possibly a tool call and a second model call. Metrics
  # can say a turn took eight seconds; only a trace says which of those four spans it was.
  tracing:
    sampling:
      # Spring Boot's default is 0.1. At that rate nine out of ten conversations produce no
      # trace at all, which reads as "tracing is broken" rather than "tracing is sampled".
      # 1.0 for a demo; lower this deliberately under real traffic.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        # Off unless a collector is actually running, otherwise `./mvnw spring-boot:run` on its
        # own fills the log with export failures. `docker compose up` turns it on, because that
        # brings Jaeger up alongside the app.
        enabled: ${OTLP_TRACING_EXPORT_ENABLED:false}

logging:
  level:
    org.springframework.ai: INFO
