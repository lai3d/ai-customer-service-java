spring:
  application:
    name: ai-customer-service-java

  # Loom. Every LLM call is a long, blocking I/O wait; virtual threads carry them
  # without dragging the whole codebase into a reactive programming model.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:csagent}
    username: ${POSTGRES_USER:csagent}
    password: ${POSTGRES_PASSWORD:csagent}
    hikari:
      maximum-pool-size: 20

  ai:
    anthropic:
      # The binder ignores an unresolvable placeholder rather than raising, so this alone
      # does NOT fail startup -- it binds to the literal "${ANTHROPIC_API_KEY}" and the
      # application reports itself healthy while every request 401s.
      # AnthropicApiKeyValidator is what actually refuses to start.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          # Spring AI 1.1.8's AnthropicApi.ChatModel enum stops at Claude Opus 4.6,
          # so current model IDs are given as plain strings.
          model: claude-opus-5
          max-tokens: 8192
          # Sampling parameters (temperature / top_p / top_k) are deliberately absent:
          # Claude Opus 5 rejects them with HTTP 400. They cannot be switched off from
          # here -- see config/AnthropicSamplingParameterStripper for why, and
          # AnthropicChatOptionsTest for the guard.

    embedding:
      transformer:
        # all-MiniLM-L6-v2 ONNX, loaded in-process. Anthropic has no embedding API.
        cache:
          enabled: true
          directory: ${user.dir}/onnx-model-cache

    vectorstore:
      pgvector:
        initialize-schema: true
        # Must match the embedding model's output width (all-MiniLM-L6-v2 = 384).
        dimensions: 384
        index-type: hnsw
        # Readable primary keys: documents are keyed "faq:returns-window" rather than an
        # opaque UUID, so a row in vector_store can be traced to its corpus entry by eye.
        # Changing this after the table exists requires recreating it.
        id-type: text
        distance-type: cosine-distance
        table-name: vector_store

    chat:
      memory:
        repository:
          jdbc:
            # Defaults to `embedded`, which is a no-op against a real Postgres.
            initialize-schema: always

app:
  rag:
    corpus-location: classpath:/faq/faq.json
    ingest-on-startup: true
    # Passages per question. Each one is re-sent on every turn it informs, so this trades
    # recall against tokens.
    top-k: 4
    # Below this similarity a passage is dropped rather than shown to the model as fact.
    # Measured against the sample corpus (see FaqRetrievalIntegrationTest): correct answers
    # to paraphrased questions score 0.34 to 0.63, unrelated questions peak at 0.11, and
    # near-miss passages sit around 0.27 to 0.29. 0.3 clears the near misses while keeping
    # the weakest true match. Retune this whenever the corpus or the embedding model changes
    # -- it is a property of both, not a universal constant.
    similarity-threshold: 0.3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.ai: INFO
