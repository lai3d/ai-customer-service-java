# Profile-specific overlay. Deliberately NOT named application.yml: a test-classpath
# application.yml shadows src/main/resources/application.yml wholesale rather than
# merging with it, which would silently un-configure the application under test.
spring:
  ai:
    anthropic:
      # Tests never reach the Anthropic API; this only has to satisfy startup.
      api-key: test-key-not-used

  datasource:
    hikari:
      # Every cached test context keeps its pool for the life of the JVM, and they all share
      # one Postgres now (PostgresTestcontainer). An idle context holding a full pool is what
      # ran the server out of clients; one idle connection each is plenty.
      minimum-idle: 1

app:
  tenancy:
    # The default tenant's key in every test context; TestTenants.AUTHORIZATION carries it.
    default-api-key: cs_testtest-the-default-tenant-key-for-tests
  knowledge-import:
    # Tests serve the pages they import from a local server.
    allow-private-networks: true
  connectors:
    # And the panels they connect to.
    allow-private-networks: true
  rag:
    # Off by default so unrelated tests do not pay for embedding the corpus. Tests that need
    # the corpus set app.rag.import-mode=startup; readiness is DOWN in every other context.
    import-mode: off
