# Local development dependencies. The application itself runs from your IDE or
# `./mvnw spring-boot:run` against these services.
#
#   docker compose up -d
#
name: ai-customer-service

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: csagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csagent}
      POSTGRES_USER: ${POSTGRES_USER:-csagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csagent} -d ${POSTGRES_DB:-csagent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
