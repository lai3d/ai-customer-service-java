# Two workflows share this file.
#
# 1. Full stack -- Postgres + the application, one command:
#
#      export ANTHROPIC_API_KEY=sk-ant-...   # or put it in .env (git-ignored)
#      docker compose up --build
#      curl localhost:8080/actuator/health
#
# 2. Dependencies only -- run the app yourself from an IDE or ./mvnw spring-boot:run:
#
#      docker compose up -d postgres
#
#    Naming the service explicitly starts nothing else, so this still works with no
#    ANTHROPIC_API_KEY set anywhere. That is why the key is passed through by name below
#    rather than interpolated with `${ANTHROPIC_API_KEY:?...}` -- Compose interpolates
#    the whole file before it looks at which service you asked for, so a `:?` guard here
#    would break workflow 2 for anyone without a key.
#
# See docs/deployment.md.

name: ai-customer-service

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: csagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csagent}
      POSTGRES_USER: ${POSTGRES_USER:-csagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csagent} -d ${POSTGRES_DB:-csagent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ai-customer-service-java:local}
    container_name: csagent-app
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      # Name-only entry: the value is taken from the shell environment or .env at run
      # time and is never written into this file. Compose renders it as unset (not empty)
      # when it is absent everywhere.
      #
      # A missing key now fails startup: ChatProviderCredentialsValidator refuses to start
      # rather than letting the container report healthy and 401 every request. That check
      # exists because Spring's Binder ignores unresolvable placeholders, so the property
      # would otherwise bind to the literal string "${ANTHROPIC_API_KEY}".
      - ANTHROPIC_API_KEY
      # Container-to-container: always the compose network alias on the internal port,
      # never POSTGRES_PORT -- that variable controls the *host* publish above and may
      # have been moved to dodge a port clash.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-csagent}
      - POSTGRES_USER=${POSTGRES_USER:-csagent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-csagent}

      # Container-specific: the app exports to Jaeger over the compose network, and tracing is
      # on here because `docker compose up` brings Jaeger up with it. Running the app directly
      # leaves export off so the log is not filled with failures against nothing.
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_ENDPOINT=http://jaeger:4318/v1/traces

      # Name-only, so an unset variable stays unset in the container and the application's own
      # default applies. Compose reads .env for interpolation but does NOT inject undeclared
      # variables into a container -- anything documented in .env.example has to be listed here
      # or it silently does nothing. ComposeEnvironmentTest asserts exactly that.
      - CHAT_PROVIDER
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_CHAT_MODEL
      - GEMINI_API_KEY
      - GEMINI_CHAT_MODEL
      - CONVERSATION_TOKEN_BUDGET
      - AI_RETRY_MAX_ATTEMPTS
      - HTTP_CONNECT_TIMEOUT
      - HTTP_READ_TIMEOUT
      - TRACING_SAMPLE_RATE
      - TRACE_INCLUDE_QUERY_CONTENT
      - SHUTDOWN_GRACE
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    # The image carries its own HEALTHCHECK (curl /actuator/health/readiness), so
    # `docker compose ps` reports real readiness without repeating it here.
    #
    # Hardened the same way as the Kubernetes pod, so the read-only-filesystem
    # assumption is exercised locally rather than discovered in a cluster. /tmp is the
    # only writable path the app needs, and it stays around 14 MB: Tomcat's work
    # directory, ONNX Runtime's unpacked native library, the (empty) Spring AI resource
    # cache directory, and any heap dump.
    read_only: true
    # `exec` is load-bearing, not boilerplate. Docker mounts tmpfs `noexec` by default,
    # and ONNX Runtime extracts libonnxruntime.so into java.io.tmpdir and System.load()s
    # it. Without `exec` the app dies at startup with
    #   UnsatisfiedLinkError: ... failed to map segment from shared object
    # 256m is comfortable for ~14 MB of real usage; do not shrink it to the observed
    # size, a heap dump lands here too.
    tmpfs:
      - /tmp:mode=1777,exec,size=256m
    security_opt:
      - no-new-privileges:true

  # Jaeger ingests OTLP natively, so no separate collector is needed for local work.
  # A real deployment would put an OpenTelemetry Collector in front of it.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    container_name: csagent-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # web UI
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP/HTTP, what the app exports to
    restart: unless-stopped

volumes:
  pgdata:
