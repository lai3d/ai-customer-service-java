# Two workflows share this file.
#
# 1. Full stack -- Postgres + the application, one command:
#
#      export ANTHROPIC_API_KEY=sk-ant-...   # or put it in .env (git-ignored)
#      docker compose up --build             # Postgres and the app, nothing else
#      curl localhost:8080/actuator/health
#
#    With the Grafana stack (Tempo, Prometheus, Loki, Alloy, Grafana), five more containers:
#
#      COMPOSE_PROFILES=observability docker compose up --build   # or put the line in .env
#      open http://localhost:3000            # Grafana: dashboards, traces, logs
#
# 2. Dependencies only -- run the app yourself from an IDE or ./mvnw spring-boot:run:
#
#      docker compose up -d postgres
#
#    Naming the service explicitly starts nothing else, so this still works with no
#    ANTHROPIC_API_KEY set anywhere. That is why the key is passed through by name below
#    rather than interpolated with `${ANTHROPIC_API_KEY:?...}` -- Compose interpolates
#    the whole file before it looks at which service you asked for, so a `:?` guard here
#    would break workflow 2 for anyone without a key.
#
# See docs/deployment.md.

name: ai-customer-service

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: csagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csagent}
      POSTGRES_USER: ${POSTGRES_USER:-csagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csagent} -d ${POSTGRES_DB:-csagent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-ai-customer-service-java:local}
    container_name: csagent-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Name-only entry: the value is taken from the shell environment or .env at run
      # time and is never written into this file. Compose renders it as unset (not empty)
      # when it is absent everywhere.
      #
      # A missing key now fails startup: ChatProviderCredentialsValidator refuses to start
      # rather than letting the container report healthy and 401 every request. That check
      # exists because Spring's Binder ignores unresolvable placeholders, so the property
      # would otherwise bind to the literal string "${ANTHROPIC_API_KEY}".
      - ANTHROPIC_API_KEY
      # Container-to-container: always the compose network alias on the internal port,
      # never POSTGRES_PORT -- that variable controls the *host* publish above and may
      # have been moved to dodge a port clash.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-csagent}
      - POSTGRES_USER=${POSTGRES_USER:-csagent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-csagent}

      # Trace export follows the profile: on when COMPOSE_PROFILES is set (which is how the
      # Grafana stack is enabled), off otherwise, so the app never exports into a Tempo that
      # is not running and fills its log with failures. The Collector profile overrides the
      # endpoint from .env; see otel-collector below.
      - OTLP_TRACING_EXPORT_ENABLED=${COMPOSE_PROFILES:+true}
      - OTLP_TRACING_ENDPOINT=${OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
      - OTLP_METRICS_EXPORT_ENABLED
      - OTLP_METRICS_ENDPOINT=${OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}

      # Name-only, so an unset variable stays unset in the container and the application's own
      # default applies. Compose reads .env for interpolation but does NOT inject undeclared
      # variables into a container -- anything documented in .env.example has to be listed here
      # or it silently does nothing. ComposeEnvironmentTest asserts exactly that.
      - CHAT_PROVIDER
      - OPENAI_API_KEY
      - OPENAI_BASE_URL
      - OPENAI_CHAT_MODEL
      - GEMINI_API_KEY
      - GEMINI_CHAT_MODEL
      - XAI_API_KEY
      - XAI_BASE_URL
      - XAI_CHAT_MODEL
      - CONVERSATION_TOKEN_BUDGET
      - AI_RETRY_MAX_ATTEMPTS
      - HTTP_CONNECT_TIMEOUT
      - HTTP_READ_TIMEOUT
      - TURN_LEASE
      - APP_RAG_IMPORT_MODE
      - APP_TARGET
      - INTERNAL_TOKEN
      - KNOWLEDGE_URL
      - TICKET_URL
      - SERVICES_TIMEOUT
      - TRACING_SAMPLE_RATE
      - TRACE_INCLUDE_QUERY_CONTENT
      - SHUTDOWN_GRACE
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    # The image carries its own HEALTHCHECK (curl /actuator/health/readiness), so
    # `docker compose ps` reports real readiness without repeating it here.
    #
    # Hardened the same way as the Kubernetes pod, so the read-only-filesystem
    # assumption is exercised locally rather than discovered in a cluster. /tmp is the
    # only writable path the app needs, and it stays around 14 MB: Tomcat's work
    # directory, ONNX Runtime's unpacked native library, the (empty) Spring AI resource
    # cache directory, and any heap dump.
    read_only: true
    # `exec` is load-bearing, not boilerplate. Docker mounts tmpfs `noexec` by default,
    # and ONNX Runtime extracts libonnxruntime.so into java.io.tmpdir and System.load()s
    # it. Without `exec` the app dies at startup with
    #   UnsatisfiedLinkError: ... failed to map segment from shared object
    # 256m is comfortable for ~14 MB of real usage; do not shrink it to the observed
    # size, a heap dump lands here too.
    tmpfs:
      - /tmp:mode=1777,exec,size=256m
    security_opt:
      - no-new-privileges:true

  # --- The Grafana stack, optional ---------------------------------------------------------
  # Behind the `observability` profile: `docker compose up` alone is Postgres and the app,
  # which is all the service needs; `COMPOSE_PROFILES=observability docker compose up` (or
  # the line in .env) adds Tempo for traces (OTLP in, TraceQL out, span-derived metrics pushed
  # to Prometheus), Prometheus pulling /actuator/prometheus, Loki for logs with Alloy tailing
  # the containers, and Grafana provisioned with the three datasources, their cross-links and
  # the dashboards in observability/grafana/dashboards. The app's trace export switches on
  # with the same variable, so nothing exports into a backend that is not running. See
  # docs/observability.md.
  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP/HTTP, what the app exports to
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # Micrometer attaches the current trace id to histogram observations; this keeps them.
      - --enable-feature=exemplar-storage
      # Tempo's metrics-generator and the optional Collector push here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.11.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy lists containers and tails their logs, nothing more.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.2.0
    environment:
      # A local stack with no login: anyone who can reach the port is an admin. Do not copy
      # this into anything that is not a laptop.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # Optional, `docker compose --profile collector up`: the application pushes traces and
  # metrics to the Collector over OTLP and it fans them out to Tempo and Prometheus. Point the
  # application at it with, in .env:
  #   OTLP_TRACING_ENDPOINT=http://otel-collector:4318/v1/traces
  #   OTLP_METRICS_EXPORT_ENABLED=true
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["collector"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  tempo-data:
  prometheus-data:
  loki-data:
