# The same image as docker-compose.yml, run as four processes instead of one:
#
#   export INTERNAL_TOKEN=$(openssl rand -hex 16)   # or put it in .env (git-ignored)
#   docker compose -f docker-compose.services.yml up --build --wait
#   curl localhost:8080/actuator/health/readiness
#
# `import` runs the knowledge role once (APP_RAG_IMPORT_MODE=once): migrates, embeds the
# corpus, records the version, exits 0. `knowledge` waits for it to complete and then serves
# search; `ticket` serves tickets; `chat` waits for both to be healthy -- which for knowledge
# means its corpus indicator is UP -- and is the only service with a host port. So on a fresh
# volume the public port opens only once there is something grounded to answer with, and the
# ordering is the file's, not the reader's memory of it.
#
# Everything reaches Postgres and the Grafana stack the way the single-process stack does. A
# trace of one turn now has spans in three containers, and Tempo's service graph draws the
# edges between them from those spans; that is what OTLP_TRACING_* is on for here.
#
# This is the distributed topology of ADR 001 (docs/adr/001-deployment-targets.md), for
# running the split on one machine and for scripts/verify-services.sh. docker-compose.yml
# stays the one-process stack and the benchmark baseline; the two share Postgres's host port,
# so run one at a time.
#
# Environment is in map form so the shared block can be merged into each service with `<<`.
# A key with no value passes the variable through from the shell or .env, and stays unset
# in the container otherwise -- the same rule as the list form in docker-compose.yml.

name: ai-customer-service-roles

x-common-env: &common-env
  # Container-to-container: always the compose network alias on the internal port.
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-csagent}
  POSTGRES_USER: ${POSTGRES_USER:-csagent}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csagent}
  OTLP_TRACING_EXPORT_ENABLED: "true"
  OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://tempo:4318/v1/traces}
  OTLP_METRICS_EXPORT_ENABLED:
  OTLP_METRICS_ENDPOINT: ${OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
  # Required: every /internal/** call between roles carries it. The `:?` guard is right here
  # because this file has no single-service workflow that could run without it.
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN -- the roles authenticate to each other with it}
  TRACING_SAMPLE_RATE:
  TRACE_INCLUDE_QUERY_CONTENT:
  SHUTDOWN_GRACE:

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ${APP_IMAGE:-ai-customer-service-java:local}
  # Hardened the same way as docker-compose.yml and the Kubernetes pods; see the comments
  # there for why `exec` on /tmp is load-bearing.
  read_only: true
  tmpfs:
    - /tmp:mode=1777,exec,size=256m
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csagent}
      POSTGRES_USER: ${POSTGRES_USER:-csagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csagent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csagent} -d ${POSTGRES_DB:-csagent}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- The Grafana stack ---------------------------------------------------------------------
  # Tempo for traces (OTLP in, TraceQL out, and span-derived metrics pushed to Prometheus),
  # Prometheus pulling /actuator/prometheus, Loki for logs with Alloy tailing the containers,
  # Grafana provisioned with the three datasources, their cross-links and the dashboards in
  # observability/grafana/dashboards. See docs/observability.md.
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"     # OTLP/HTTP, what the app exports to
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      # Micrometer attaches the current trace id to histogram observations; this keeps them.
      - --enable-feature=exemplar-storage
      # Tempo's metrics-generator and the optional Collector push here.
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus-roles.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy lists containers and tails their logs, nothing more.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      # A local stack with no login: anyone who can reach the port is an admin. Do not copy
      # this into anything that is not a laptop.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # Optional, `docker compose --profile collector up`: the application pushes traces and
  # metrics to the Collector over OTLP and it fans them out to Tempo and Prometheus. Point the
  # application at it with, in .env:
  #   OTLP_TRACING_ENDPOINT=http://otel-collector:4318/v1/traces
  #   OTLP_METRICS_EXPORT_ENABLED=true
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["collector"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

  # Runs once and exits: the Kubernetes Job, in Compose clothing.
  import:
    <<: *app
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      APP_TARGET: knowledge
      APP_RAG_IMPORT_MODE: once
    # The image's HEALTHCHECK probes readiness, which a run-once process never reports; without
    # this Compose would call the importer unhealthy while it was doing its job.
    healthcheck:
      disable: true

  knowledge:
    <<: *app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      import:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    environment:
      <<: *common-env
      APP_TARGET: knowledge
      # Serving replicas never import; the importer above did. The role's own default is
      # `off`, spelled out here so the file says what happens.
      APP_RAG_IMPORT_MODE: "off"

  ticket:
    <<: *app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      <<: *common-env
      APP_TARGET: ticket

  chat:
    <<: *app
    restart: unless-stopped
    depends_on:
      # `service_healthy` is the image's readiness probe, and knowledge's readiness includes
      # its corpus indicator: chat starts only once there is a corpus to retrieve from.
      knowledge:
        condition: service_healthy
      ticket:
        condition: service_healthy
      tempo:
        condition: service_started
    environment:
      <<: *common-env
      APP_TARGET: chat
      KNOWLEDGE_URL: http://knowledge:8080
      TICKET_URL: http://ticket:8080
      # The model, and everything else only the chat role reads. Pass-through, same as the
      # single-process file; ComposeEnvironmentTest checks the list against .env.example.
      ANTHROPIC_API_KEY:
      CHAT_PROVIDER:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      OPENAI_CHAT_MODEL:
      GEMINI_API_KEY:
      GEMINI_CHAT_MODEL:
      XAI_API_KEY:
      XAI_BASE_URL:
      XAI_CHAT_MODEL:
      CONVERSATION_TOKEN_BUDGET:
      AI_RETRY_MAX_ATTEMPTS:
      HTTP_CONNECT_TIMEOUT:
      HTTP_READ_TIMEOUT:
      TURN_LEASE:
      SERVICES_TIMEOUT:
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
  tempo-data:
  prometheus-data:
  loki-data:
