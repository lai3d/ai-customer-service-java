# TEMPLATE ONLY -- every value below is a placeholder. Do not `kubectl apply -f` this
# file as-is and do not fill it in and commit it.
#
# This file lives in k8s/examples/ rather than k8s/ for a reason that was measured, not
# guessed. When it sat next to the other manifests, `kubectl apply -f k8s/` -- the first
# thing anyone types -- swept it up and replaced a working Secret with these
# placeholders. kubectl's only complaint was a warning about a missing annotation, which
# ends "The missing annotation will be patched automatically" and reads like
# reassurance. The pods then failed Postgres auth and, had the database been reachable,
# would have started, reported healthy, and 401'd every request.
#
# `kubectl apply -f <dir>` is not recursive, so a subdirectory cannot be swept up. The
# warning in this comment could not stop it; the directory can.
#
# Preferred: create the Secret imperatively, so the real values never touch a file that
# git can see.
#
#   kubectl -n ai-customer-service create secret generic ai-customer-service-secrets \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=POSTGRES_USER='csagent' \
#     --from-literal=POSTGRES_PASSWORD="$PGPASSWORD"
#
# Better still, for anything beyond a demo cluster: hand this over to External Secrets
# Operator, Sealed Secrets, or your cloud's secret manager via CSI, and delete this file
# from the deployment path entirely. A plain Kubernetes Secret is base64, not encryption.
#
# If you must use this file, copy it -- `cp k8s/examples/secret.yaml k8s/secret.yaml` --
# and edit the copy. `k8s/secret.yaml` and `k8s/*.secret.yaml` are git-ignored for
# exactly this.
apiVersion: v1
kind: Secret
metadata:
  name: ai-customer-service-secrets
  namespace: ai-customer-service
  labels:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: app
type: Opaque
# stringData, not data: values are written in plain text and Kubernetes base64-encodes
# them. Using `data` here would just invite someone to paste a base64 blob and assume it
# is protected.
stringData:
  # https://console.anthropic.com/settings/keys
  ANTHROPIC_API_KEY: "REPLACE_ME_WITH_ANTHROPIC_API_KEY"
  POSTGRES_USER: "REPLACE_ME_WITH_POSTGRES_USER"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_POSTGRES_PASSWORD"
