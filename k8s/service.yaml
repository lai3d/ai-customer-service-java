apiVersion: v1
kind: Service
metadata:
  name: ai-customer-service
  namespace: ai-customer-service
  labels:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: app
spec:
  # ClusterIP: exposure to the outside world is an Ingress/Gateway decision, and this
  # app has no authentication (deliberately, for now), so do not reach for LoadBalancer
  # without putting something in front of it.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  # The chat endpoint streams over SSE and conversation memory is keyed by conversation
  # id in Postgres, so any replica can serve any turn -- no session affinity needed.
  sessionAffinity: None
