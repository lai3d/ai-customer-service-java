# The ticket role. Tickets, deduplication and the cap, over Postgres. No model of any kind:
# APP_TARGET=ticket switches the chat model and the embedding model off before
# auto-configuration, so this pod starts with no LLM key and never unpacks ONNX Runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket
  namespace: ai-customer-service
  labels:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: ticket
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-customer-service-java
      app.kubernetes.io/component: ticket
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-customer-service-java
        app.kubernetes.io/component: ticket
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      # Above SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE (30s) in the ConfigMap.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/lai3d/ai-customer-service-java:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_TARGET
              value: ticket
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-customer-service-roles-config
            - secretRef:
                name: ai-customer-service-secrets
          resources:
            # No ONNX session, no model client: a plain Spring MVC process over JDBC. Measured on
            # kind (cgroup memory.peak): 333 MiB at startup.
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness is the datasource: a ticket pod with no Postgres drops out of its Service.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket
  namespace: ai-customer-service
  labels:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: ticket
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-customer-service-java
    app.kubernetes.io/component: ticket
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  sessionAffinity: None
