name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The ONNX embedding model is downloaded on first use. The key is derived from the
      # configured model URI, so switching models invalidates the cache instead of pinning
      # it to a stale entry that never saves the new weights.
      - name: Resolve embedding model cache key
        id: embedding-model
        run: |
          key=$(grep -oE 'model-uri: .*' src/main/resources/application.yml | sha256sum | cut -c1-16)
          echo "key=onnx-$key" >> "$GITHUB_OUTPUT"

      - name: Cache ONNX embedding model
        uses: actions/cache@v4
        with:
          path: onnx-model-cache
          key: ${{ steps.embedding-model.outputs.key }}

      # Testcontainers provisions Postgres itself; the runner only needs a daemon,
      # which ubuntu-latest already has.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
